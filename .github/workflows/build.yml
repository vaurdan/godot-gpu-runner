name: build-image
# push to main         -> :4.7.2 and :sha-<sha> (what gpu-job uses by default)
# push to stage/<name> -> :4.7.2-<name> and :sha-<sha> (staging; :4.7.2 does not move)
# workflow_dispatch with promote=<tag|sha256:digest> -> no build: the current :4.7.2 is copied to :<backup_as>, then the
#   given image is copied to :4.7.2 (same digest), so a validated staging image becomes the default without a rebuild
on:
  push:
    branches: [main, 'stage/**']
  workflow_dispatch:
    inputs:
      promote:
        description: 'Copy this tag or sha256:digest to :4.7.2 instead of building (empty = build this ref)'
        required: false
        default: ''
      backup_as:
        description: 'Tag that keeps the previous :4.7.2 (rollback with GPU_IMAGE_TAG=<this>)'
        required: false
        default: '4.7.2-prev'
permissions:
  contents: read
  packages: write
jobs:
  build:
    if: github.event_name == 'push' || inputs.promote == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then echo "t=4.7.2" >> "$GITHUB_OUTPUT"
          else n=${GITHUB_REF_NAME#stage/}; echo "t=4.7.2-${n//[^A-Za-z0-9_.-]/-}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/godot-gpu-runner:${{ steps.tag.outputs.t }}
            ghcr.io/${{ github.repository_owner }}/godot-gpu-runner:sha-${{ github.sha }}
  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.promote != ''
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - env:
          SRC: ${{ inputs.promote }}
          BAK: ${{ inputs.backup_as }}
        run: |
          set -eu
          R=ghcr.io/${{ github.repository_owner }}/godot-gpu-runner
          case $SRC in sha256:*) S="$R@$SRC" ;; *) S="$R:$SRC" ;; esac
          dig() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["digest"])'; }
          OLD=$(dig "$R:4.7.2"); NEW=$(dig "$S")
          echo "old :4.7.2 = $OLD"; echo "new $SRC = $NEW"
          docker buildx imagetools create -t "$R:$BAK" "$R@$OLD"
          docker buildx imagetools create -t "$R:4.7.2" "$R@$NEW"
          echo "now :4.7.2 = $(dig "$R:4.7.2"), :$BAK = $(dig "$R:$BAK")"
          [ "$(dig "$R:4.7.2")" = "$NEW" ] && [ "$(dig "$R:$BAK")" = "$OLD" ]

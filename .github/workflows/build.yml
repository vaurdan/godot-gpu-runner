name: build-image
# push to main         -> :4.7.2 and :sha-<sha> (what gpu-job uses by default)
# push to stage/<name> -> :4.7.2-<name> and :sha-<sha> (staging; :4.7.2 does not move)
# workflow_dispatch with promote=<tag|sha256:digest> -> no build: the image now under :<target> (default 4.7.2) is also tagged
#   :<backup_as>, then the given image is tagged :<target> (same digest), so a validated staging image becomes the default
#   without a rebuild
on:
  push:
    branches: [main, 'stage/**']
  workflow_dispatch:
    inputs:
      promote:
        description: 'Copy this tag or sha256:digest to :4.7.2 instead of building (empty = build this ref)'
        required: false
        default: ''
      backup_as:
        description: 'Tag that keeps the image previously under the target tag (rollback with GPU_IMAGE_TAG=<this>; empty = no backup)'
        required: false
        default: '4.7.2-prev'
      target:
        description: 'Tag to move (default 4.7.2)'
        required: false
        default: '4.7.2'
permissions:
  contents: read
  packages: write
jobs:
  build:
    if: github.event_name == 'push' || inputs.promote == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then echo "t=4.7.2" >> "$GITHUB_OUTPUT"
          else n=${GITHUB_REF_NAME#stage/}; echo "t=4.7.2-${n//[^A-Za-z0-9_.-]/-}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/godot-gpu-runner:${{ steps.tag.outputs.t }}
            ghcr.io/${{ github.repository_owner }}/godot-gpu-runner:sha-${{ github.sha }}
  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.promote != ''
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          SRC: ${{ inputs.promote }}
          BAK: ${{ inputs.backup_as }}
          TGT: ${{ inputs.target }}
        run: |
          set -eu
          # crane tag adds a tag to the existing manifest: the digest is kept exactly (imagetools create re-wraps it)
          curl -fsSL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz | tar -xz -C "$RUNNER_TEMP" crane
          C=$RUNNER_TEMP/crane; R=ghcr.io/${{ github.repository_owner }}/godot-gpu-runner; T=${TGT:-4.7.2}
          case $SRC in sha256:*) S="$R@$SRC" ;; *) S="$R:$SRC" ;; esac
          NEW=$($C digest "$S"); OLD=$($C digest "$R:$T" 2>/dev/null || true)
          echo "old :$T = ${OLD:-none}"; echo "new $SRC = $NEW"
          if [ -n "$BAK" ] && [ -n "$OLD" ]; then $C tag "$R@$OLD" "$BAK"; [ "$($C digest "$R:$BAK")" = "$OLD" ]; fi
          $C tag "$R@$NEW" "$T"
          echo "now :$T = $($C digest "$R:$T")${BAK:+, :$BAK = $($C digest "$R:$BAK" 2>/dev/null)}"
          [ "$($C digest "$R:$T")" = "$NEW" ]
